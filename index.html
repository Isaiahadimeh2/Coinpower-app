<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. YOUR CONNECTION KEYS
    const supabaseUrl = 'YOUR_SUPABASE_URL'; // Copy from Supabase Settings > API
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // Copy from Supabase Settings > API
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. REGISTRATION LOGIC
    async function register() {
        const username = document.getElementById('reg-user').value.trim();
        const fname = document.getElementById('reg-fname').value.trim();
        const lname = document.getElementById('reg-lname').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const pass = document.getElementById('reg-pass').value;

        if(!username || !fname || !phone || !pass) return alert("Fill all fields!");

        // Save to Supabase 'users' table
        const { data, error } = await supabase
            .from('profiles') // Make sure you have a 'profiles' or 'users' table
            .insert([{ 
                username: username, 
                first_name: fname, 
                phone: phone, 
                password: pass,
                balance: 1.0 
            }]);

        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("✅ Success!");
            showDashboard({firstName: fname});
        }
    }

    function showDashboard(userData) {
        document.getElementById('auth-page').classList.add('hidden');
        document.getElementById('dash-page').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = userData.firstName;
    }
</script>
