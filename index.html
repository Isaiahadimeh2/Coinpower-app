<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinPower | Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #b8860b; --p-green: #28a745; --dark: #1a1a1a; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 50px; }
        .container { max-width: 420px; margin: auto; padding: 20px; }
        
        /* Generator Card Styling */
        .market-grid { display: grid; gap: 20px; margin-top: 20px; }
        .gen-card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; text-align: center; }
        .gen-img { width: 100%; hieght: 150px; object-fit: cover; border-radius: 10px; background: #eee; }
        .gen-name { font-size: 1.2rem; font-weight: bold; margin: 10px 0 5px; color: var(--dark); }
        .gen-price { color: var(--p-green); font-weight: bold; font-size: 1.1rem; }
        .gen-stats { display: flex; justify-content: space-around; font-size: 0.8rem; color: #666; margin: 10px 0; }
        
        .btn-buy { background: var(--gold); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        
        /* Header Area */
        .user-bar { background: var(--dark); color: white; padding: 20px; border-radius: 0 0 25px 25px; text-align: center; }
    </style>
</head>
<body>

    <div class="user-bar">
        <h1>CoinPower Market</h1>
        <p>Current Balance: <span id="balance">$0.00</span></p>
    </div>

    <div class="container">
        <h3>Available Power Units</h3>
        <div id="market-grid" class="market-grid">
            <p id="loading-text">Loading Generators...</p>
        </div>
    </div>

    <script>
        // 1. CONNECTION (Fill these from your Supabase Settings > API)
        const SB_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SB_KEY = 'YOUR_ANON_PUBLIC_KEY';
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        // 2. FETCH GENERATORS FROM DATABASE
        async function loadGenerators() {
            const { data, error } = await supabase
                .from('generators')
                .select('*')
                .order('price', { ascending: true });

            if (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading-text').innerText = "Error loading market.";
                return;
            }

            const grid = document.getElementById('market-grid');
            grid.innerHTML = ''; // Clear loading text

            data.forEach(gen => {
                const card = `
                    <div class="gen-card">
                        <img src="${gen.image_url || 'https://via.placeholder.com/150'}" class="gen-img">
                        <div class="gen-name">${gen.name}</div>
                        <div class="gen-price">$${gen.price.toFixed(2)}</div>
                        <div class="gen-stats">
                            <span>Daily: $${gen.daily_income}</span>
                            <span>Term: ${gen.duration_days} Days</span>
                        </div>
                        <button class="btn-buy" onclick="buyGen('${gen.id_code}', ${gen.price})">Rent Now</button>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // 3. RENT LOGIC
        async function buyGen(idCode, price) {
            alert("Checking system for: " + idCode);
            // Here you would add the logic to check user balance and insert into user_rentals
        }

        // Run on Page Load
        loadGenerators();
    </script>
</body>
</html>
