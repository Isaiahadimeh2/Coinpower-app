<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinPower | Offline Test Mode</title>
    <style>
        :root { --gold: #b8860b; --p-green: #28a745; --dark: #1a1a1a; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 0; }
        .container { width: 100%; max-width: 420px; margin: auto; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: var(--gold); text-align: center; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { background: var(--p-green); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .balance-box { background: var(--dark); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .gen-card { background: white; border-radius: 15px; padding: 15px; border: 1px solid #eee; text-align: center; margin-bottom: 15px; }
        .hidden { display: none !important; }
        .nav-link { text-align: center; font-size: 0.85rem; color: #888; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-page" class="container">
        <div class="card">
            <h1>CoinPower</h1>
            <p style="text-align:center;">TEST MODE (No Database)</p>
            <input type="text" id="reg-user" placeholder="Username">
            <input type="text" id="reg-pass" placeholder="Password">
            <button class="btn" onclick="fakeRegister()">Create Test Account</button>
        </div>
    </div>

    <div id="main-app" class="container hidden">
        <div class="balance-box">
            <p style="margin:0;">Wallet Balance</p>
            <h2 id="user-balance" style="font-size: 2.5rem; margin: 5px 0;">$1.00</h2>
            <p id="user-welcome">Welcome!</p>
        </div>

        <h3>Marketplace</h3>
        <div class="gen-card">
            <div style="font-weight:bold;">PG1 Unit</div>
            <div style="color:var(--p-green); font-weight:bold;">$10.00</div>
            <button class="btn" style="padding:8px;" onclick="fakeRent('PG1')">Rent Now</button>
        </div>
        
        <button class="btn" style="background:var(--dark);" onclick="location.reload()">Reset Test</button>
    </div>

    <script>
        function fakeRegister() {
            const user = document.getElementById('reg-user').value;
            if(!user) return alert("Enter a name!");
            
            // Show Success Message
            alert("✅ SUCCESS! Account created in Test Mode.");
            
            // Switch Screens
            document.getElementById('auth-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = "Welcome, " + user + "!";
        }

        function fakeRent(name) {
            alert("🛒 Order Placed for: " + name + "\n(In test mode, no money is actually spent)");
        }
    </script>
</body>
</html>
