<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinpower App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="active-page" class="page-section">
            <div class="page-header">
                <h2>⚡ Your Active Miners</h2>
                <p>Real-time energy production status.</p>
            </div>
            <div id="miners-container">
                </div>
        </div>

        <div class="page-section mt-8">
            <div class="page-header">
                <h2>💰 Transaction History</h2>
                <p>Recent earnings and activity.</p>
            </div>
            <div id="transactions-container" class="history-list">
                </div>
        </div>

        <button onclick="signOut()" class="logout-btn">Sign Out</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
