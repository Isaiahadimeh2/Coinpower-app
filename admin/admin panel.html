<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinPower | MASTER ADMIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --green: #28a745; --red: #dc3545; --dark: #121212; --light-dark: #1e1e1e; --white: #FFFFFF; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--white); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #0a0a0a; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--gold); font-size: 1.2rem; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
        .nav-btn { background: none; border: none; color: #aaa; padding: 15px; text-align: left; cursor: pointer; font-size: 15px; width: 100%; border-radius: 8px; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: #222; color: var(--gold); font-weight: bold; }

        /* Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--light-dark); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 25px; }
        
        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #222; padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); text-align: center; }
        .stat-box h3 { margin: 0; font-size: 0.9rem; color: #888; }
        .stat-box p { margin: 10px 0 0; font-size: 1.8rem; font-weight: bold; color: var(--white); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--gold); padding: 15px; border-bottom: 2px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; }
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; }
        .btn-approve { background: var(--green); color: white; }
        .btn-reject { background: var(--red); color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>COINPOWER ADMIN</h2>
        <button class="nav-btn active" onclick="showPage('dashboard')">🏠 Dashboard</button>
        <button class="nav-btn" onclick="showPage('payments')">💸 Payout Requests</button>
        <button class="nav-btn" onclick="showPage('users')">👤 User Management</button>
        <button class="nav-btn" onclick="showPage('generators')">⚡ Edit Generators</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="page active">
            <h1>Platform Overview</h1>
            <div class="stats-grid">
                <div class="stat-box"><h3>Total Users</h3><p id="total-users">0</p></div>
                <div class="stat-box"><h3>Active Miners</h3><p id="active-miners">0</p></div>
                <div class="stat-box"><h3>Pending Payouts</h3><p id="pending-payouts">0</p></div>
            </div>
        </div>

        <div id="payments" class="page">
            <h1>Withdrawal Requests</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr><th>User Phone</th><th>Amount</th><th>After 15% Fee</th><th>MoMo Number</th><th>Action</th></tr>
                    </thead>
                    <tbody id="payout-table">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="users" class="page">
            <h1>Manage Accounts</h1>
            <div class="card">
                <input type="text" id="userSearch" placeholder="Enter phone number..." style="padding: 10px; width: 70%; border-radius: 5px;">
                <button class="btn btn-approve" onclick="searchUser()">Search</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Supabase
        const _supabase = supabase.createClient('https://xbztonzjtkkcqrrfpyyt.supabase.co', 'YOUR_ANON_KEY');

        // 2. Navigation Logic
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
        }

        // 3. Load Stats (Example)
        async function loadStats() {
            const { count, error } = await _supabase.from('users').select('*', { count: 'exact', head: true });
            if (!error) document.getElementById('total-users').innerText = count;
        }

        // 4. Fetch Payouts (Filtering for James Cole's MoMo processing)
        async function fetchPayouts() {
            const { data, error } = await _supabase.from('withdrawals').select('*').eq('status', 'pending');
            const table = document.getElementById('payout-table');
            table.innerHTML = "";
            
            data.forEach(req => {
                const feeAmount = req.amount * 0.85; // Showing what user actually gets after 15%
                table.innerHTML += `
                    <tr>
                        <td>${req.phone}</td>
                        <td>$${req.amount}</td>
                        <td style="color: var(--green);">$${feeAmount.toFixed(2)}</td>
                        <td>${req.momo_number}</td>
                        <td>
                            <button class="btn btn-approve">Paid</button>
                            <button class="btn btn-reject">Reject</button>
                        </td>
                    </tr>
                `;
            });
        }

        loadStats();
        fetchPayouts();
    </script>
</body>
</html>
