<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinPower | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --green: #28a745; --white: #FFFFFF; --black: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; padding: 0; }
        .top-bar { background: var(--white); padding: 15px; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: linear-gradient(135deg, var(--green), #1e7e34); color: white; margin: 20px; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .market-title { margin: 20px; color: var(--black); font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #ddd; text-align: center; }
        .card img { width: 60px; margin-bottom: 10px; }
        .rent-btn { background: var(--gold); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .withdraw-card { background: white; margin: 20px; padding: 20px; border-radius: 15px; border: 2px dashed var(--gold); }
    </style>
</head>
<body>

    <div class="top-bar">
        <strong style="color: var(--gold); font-size: 20px;">COINPOWER</strong>
        <span id="user-phone" style="color: var(--gray); font-size: 14px;">+233...</span>
    </div>

    <div class="balance-box">
        <p style="margin: 0; opacity: 0.8;">Total Balance</p>
        <h1 id="balance-display" style="margin: 5px 0;">$0.00</h1>
        <button onclick="location.href='deposit.html'" style="background: white; color: var(--green); border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; margin-top: 10px;">Deposit</button>
    </div>

    <div class="market-title">Mining Machines</div>
    <div class="grid">
        <div class="card">
            <div style="font-size: 30px;">🔋</div>
            <h4 style="margin: 5px 0;">PG1</h4>
            <p style="font-size: 12px; color: var(--green);">Income: $0.50/day</p>
            <button class="rent-btn">RENT (FREE)</button>
        </div>
        <div class="card">
            <div style="font-size: 30px;">⚡</div>
            <h4 style="margin: 5px 0;">PG2</h4>
            <p style="font-size: 12px; color: var(--green);">Income: $1.20/day</p>
            <button class="rent-btn">RENT ($10)</button>
        </div>
    </div>

    <div class="withdraw-card">
        <h4>Withdrawal</h4>
        <input type="number" id="w-amount" placeholder="Enter Amount" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
        <p style="font-size: 11px; color: #888;">* 15% maintenance fee will be deducted automatically.</p>
        <button class="rent-btn" style="background: var(--green);">Request Payout</button>
    </div>

    <script>
        // Remember to add your keys here too!
        const _url = 'YOUR_SUPABASE_URL';
        const _key = 'YOUR_SUPABASE_ANON_KEY';
        // ... Logic to load user data from Supabase ...
    </script>
</body>
</html>
