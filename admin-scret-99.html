<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinPower | ADMIN ONLY</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --green: #28a745; --red: #dc3545; }
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .admin-card { background: #333; border: 1px solid var(--gold); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #444; color: var(--gold); }
        .approve-btn { background: var(--green); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .reject-btn { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="color: var(--gold);">COINPOWER ADMIN SYSTEM</h1>
    
    <div class="admin-card">
        <h3>Pending Deposits (MoMo)</h3>
        <p>Check your phone for +233257758007 before clicking Approve!</p>
        <table id="deposit-table">
            <thead>
                <tr>
                    <th>Phone</th>
                    <th>Amount ($)</th>
                    <th>Reference</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="deposit-body">
                </tbody>
        </table>
    </div>

    <script>
        const supabase = supabase.createClient('YOUR_URL', 'YOUR_KEY');

        async function loadDeposits() {
            const { data, error } = await supabase
                .from('deposits')
                .select('*')
                .eq('status', 'pending');

            const container = document.getElementById('deposit-body');
            container.innerHTML = "";

            data.forEach(dep => {
                container.innerHTML += `
                    <tr>
                        <td>${dep.phone_number}</td>
                        <td>$${dep.amount}</td>
                        <td>${dep.reference}</td>
                        <td>
                            <button class="approve-btn" onclick="approve('${dep.id}', '${dep.phone_number}', ${dep.amount})">APPROVE</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function approve(id, phone, amount) {
            // 1. Mark deposit as 'completed'
            await supabase.from('deposits').update({ status: 'completed' }).eq('id', id);
            
            // 2. Add the money to the user's balance
            const { data: user } = await supabase.from('Coinpower').select('balance').eq('phone_number', phone).single();
            const newBalance = parseFloat(user.balance) + parseFloat(amount);
            
            await supabase.from('Coinpower').update({ balance: newBalance }).eq('phone_number', phone);
            
            alert("Funds Approved and Added!");
            loadDeposits(); // Refresh the list
        }

        loadDeposits();
    </script>
</body>
</html>
