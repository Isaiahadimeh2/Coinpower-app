<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinPower | ADMIN ONLY</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --green: #28a745; --red: #dc3545; --dark: #121212; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; padding: 20px; }
        .admin-card { background: #1e1e1e; border: 1px solid var(--gold); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #181818; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #2a2a2a; color: var(--gold); }
        .approve-btn { background: var(--green); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .reject-btn { background: var(--red); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .approve-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>COINPOWER ADMIN SYSTEM</h1>
    
    <div class="admin-card">
        <h3>Pending Deposits (MoMo)</h3>
        <p style="color: #888;">Step 1: Verify funds on phone **+233257758007** (James Cole)</p>
        <p style="color: #888;">Step 2: Match the Reference code before approving.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Phone</th>
                    <th>Amount ($)</th>
                    <th>Reference</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="deposit-body">
                </tbody>
        </table>
    </div>

    <script>
        // Use your specific project URL
        const supabaseUrl = 'https://xbztonzjtkkcqrrfpyyt.supabase.co';
        const supabaseKey = 'YOUR_ANON_KEY'; // MUST replace with your actual key from Vercel/Supabase
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadDeposits() {
            // Loading from 'deposits' table
            const { data, error } = await _supabase
                .from('deposits')
                .select('*')
                .eq('status', 'pending');

            if (error) {
                console.error("Error loading deposits:", error);
                return;
            }

            const container = document.getElementById('deposit-body');
            container.innerHTML = data.length === 0 ? "<tr><td colspan='4' style='text-align:center;'>No pending deposits</td></tr>" : "";

            data.forEach(dep => {
                container.innerHTML += `
                    <tr>
                        <td>${dep.phone_number}</td>
                        <td>$${dep.amount}</td>
                        <td><code style="color:var(--gold)">${dep.reference}</code></td>
                        <td>
                            <button class="approve-btn" onclick="approve('${dep.id}', '${dep.phone_number}', ${dep.amount})">APPROVE</button>
                            <button class="reject-btn" onclick="reject('${dep.id}')">REJECT</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function approve(id, phone, amount) {
            if(!confirm(`Confirm adding $${amount} to ${phone}?`)) return;

            // 1. Mark deposit as 'completed'
            await _supabase.from('deposits').update({ status: 'completed' }).eq('id', id);
            
            // 2. Fetch current balance from the 'users' table (your master table)
            const { data: user } = await _supabase.from('users').select('balance').eq('phone_number', phone).single();
            
            if(user) {
                const newBalance = parseFloat(user.balance || 0) + parseFloat(amount);
                // 3. Update the user balance
                await _supabase.from('users').update({ balance: newBalance }).eq('phone_number', phone);
                alert("Success: Funds added to user wallet!");
            } else {
                alert("Error: User phone number not found in database!");
            }
            
            loadDeposits();
        }

        async function reject(id) {
            if(confirm("Reject this deposit?")) {
                await _supabase.from('deposits').update({ status: 'rejected' }).eq('id', id);
                loadDeposits();
            }
        }

        loadDeposits();
    </script>
</body>
</html>
